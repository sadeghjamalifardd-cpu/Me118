{
 "name": "Build APK",
 "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}},
 "jobs": {"apk": {"runs-on": "ubuntu-latest", "steps": [
  {"uses": "actions/checkout@v4"},
  {"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
  {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 21}},
  {"run": "bash build.sh"},
  {"uses": "actions/upload-artifact@v4", "with": {"name": "daftar-apk", "path": "android/app/build/outputs/apk/debug/app-debug.apk"}}
 ]}}
}
